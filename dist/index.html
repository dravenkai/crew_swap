<!doctype html>
<html lang="en" data-type="software" data-radius="soft" data-buttons="pill" data-motion data-ground="deep">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <title>Crew Swap — Mission readiness console</title>
  <meta name="description" content="Review measured sleep, confirm a stand-down, and replan cooling-loop coverage before Earth hears about it.">
  <meta name="site-kind" content="software">
  <meta name="page-type" content="software">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/motion/motion.css">
  <link rel="stylesheet" href="styles.css">
  <script>document.documentElement.classList.add('m-enter');setTimeout(()=>document.documentElement.classList.add('m-enter-done'),700)</script>
</head>
<body>
  <!-- brand dark space: bg #0a0c10 surface #12161c ink #e8ebe4 accent #8eb6c4 · type host · effect aurora-curtains · pill · soft · brief forbids light default -->
  <a class="skip-link" href="#main">Skip to console</a>

  <aside class="sidebar" data-enter>
    <a class="brand" href="#overview" aria-label="Crew Swap overview">
      <span class="brand-mark" aria-hidden="true"></span>
      <span>Crew<span class="brand-light">Swap</span></span>
    </a>
    <nav aria-label="Main navigation">
      <button class="nav-item" data-view="overview"><span aria-hidden="true">▦</span>Overview</button>
      <button class="nav-item" data-view="health"><span aria-hidden="true">♡</span>Health<span class="nav-count" id="attention-count">1</span></button>
      <button class="nav-item" data-view="plan"><span aria-hidden="true">▤</span>Plan</button>
      <button class="nav-item" data-view="quals"><span aria-hidden="true">▣</span>Quals</button>
      <button class="nav-item" data-view="log"><span aria-hidden="true">≡</span>Log<span class="nav-count muted" id="log-count">0</span></button>
    </nav>
    <div class="mission-card">
      <div class="mission-orbit" aria-hidden="true"><span></span><i></i></div>
      <strong>Ares · Day 187</strong>
      <div class="mission-progress"><span></span></div>
      <div class="mission-days"><span>187</span><span>240</span></div>
    </div>
    <div class="sidebar-bottom">
      <button class="text-button" id="sources-button"><span>ⓘ</span> Sources</button>
      <button class="text-button" id="reset-button"><span>↺</span> Reset</button>
      <label class="role-switch">
        <span class="metric-label">Role</span>
        <select id="role-select" aria-label="Switch operator role">
          <option value="medical">Medical officer</option>
          <option value="commander">Commander</option>
        </select>
      </label>
      <div class="operator">
        <span class="avatar small" id="operator-avatar" aria-hidden="true"></span>
        <div><strong id="operator-name">A. Okonkwo</strong><span id="operator-role">Crew medical officer</span></div>
        <span class="online-dot"></span>
      </div>
    </div>
  </aside>

  <main id="main">
    <div class="fx-stage hero section--hero" aria-hidden="true">
      <div class="fx-panel"
           data-fx="aurora-curtains"
           data-fx-seed="29"
           data-fx-palette='{"bg":"#0a0c10","surface":"#12161c","ink":"#e8ebe4","muted":"#8b939e","accent":"#8eb6c4"}'
           data-fx-params='{"speed":0.035,"bands":3,"height":0.62,"intensity":1.05,"stars":0.45,"calm":0.78,"calmX":0.5,"calmY":0.55}'></div>
    </div>

    <header class="topbar">
      <div class="breadcrumb"><strong id="breadcrumb-current">Overview</strong></div>
      <div class="topbar-right">
        <span class="preview-tag">BIDSleep</span>
        <span class="mission-time"><b>08:42</b> UTC</span>
        <button class="icon-button mobile-tools" id="mobile-tools" aria-label="Options">⋯</button>
      </div>
    </header>

    <div class="content">
      <section class="page-title" data-enter>
        <div>
          <h1 id="page-heading">Overview</h1>
        </div>
        <button class="button btn btn--primary primary" id="new-checkin"><span>＋</span> Check-in</button>
      </section>

      <div class="connection-strip">
        <span><i class="online-dot"></i> Onboard</span>
        <span class="strip-end">Next <b id="next-operation">09:30 · Cooling loop</b></span>
      </div>

      <section class="alert-banner" id="alert-banner">
        <span class="alert-icon">!</span>
        <div>
          <strong id="alert-title">L. Chen needs review</strong>
          <p id="alert-description" class="sr-only">Check-in awaiting review.</p>
        </div>
        <button class="button btn btn--primary alert-button" id="review-checkin">Review <span>↗</span></button>
      </section>

      <section id="crew-section">
        <div class="section-heading">
          <h2>Crew <span>4</span></h2>
          <span class="legend"><i class="dot green"></i> Ready <i class="dot amber"></i> Review <i class="dot gray"></i> Down</span>
        </div>
        <div id="crew-grid" class="crew-grid"></div>
      </section>

      <div class="workspace" id="workspace">
        <section class="panel schedule-panel">
          <div class="panel-header">
            <div><h2>Plan</h2></div>
            <div class="schedule-tools">
              <span class="version-pill" id="version-label">v01</span>
              <button class="icon-button" id="open-plan" aria-label="Expand plan">↗</button>
            </div>
          </div>
          <div class="schedule-summary">
            <span><i class="dot green"></i> <b id="coverage-label">4 tasks</b></span>
          </div>
          <div id="schedule" class="schedule"></div>
          <div class="schedule-footer">
            <span id="plan-footer"></span>
            <button class="text-link link" id="review-options">Coverage →</button>
          </div>
        </section>
        <section class="panel health-panel" id="health-panel"></section>
      </div>

      <section class="panel log-panel hidden" id="log-panel">
        <div class="panel-header">
          <div><h2>Decision log</h2></div>
          <button class="button btn btn--secondary secondary" id="export-log">Export ↓</button>
        </div>
        <div id="log-content"></div>
      </section>

      <section class="panel quals-panel hidden" id="qualifications-panel"></section>
    </div>
  </main>

  <dialog id="dialog"><div id="dialog-content"></div></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script type="module" src="assets/system.js"></script>
  <script type="module" src="assets/motion/motion.js"></script>
  <script src="app.js"></script>
</body>
</html>
